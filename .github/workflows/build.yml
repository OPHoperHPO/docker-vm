name: Build VM images

on:
  push:
    branches: ['**']
    paths:
      - 'images/**'
      - 'shared/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'images/**'
      - 'shared/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push the built images to GHCR (only ever needed off the default branch)'
        type: boolean
        required: false
        default: false
      targets:
        description: 'Which images to build: all, ubuntu, windows, macos'
        required: false
        default: 'all'
      win_version:
        description: 'Windows version key from dockur/windows define.sh (e.g. win11x64, win11x64-enterprise-iot-eval, win10x64-enterprise-ltsc-eval)'
        required: false
        default: 'win11x64-enterprise-iot-eval'
      win_iso_url:
        description: 'Override: explicit Windows ISO URL (skips auto-resolve)'
        required: false
        default: ''
      win_iso_sha256:
        description: 'Override: SHA256 (must be set if win_iso_url is)'
        required: false
        default: ''
      ubuntu_codename:
        description: 'Ubuntu codename (e.g. noble for 24.04, jammy for 22.04)'
        required: false
        default: 'noble'
      macos_version:
        description: 'macOS version to bake (26/tahoe, 15/sequoia, 14/sonoma, 13/ventura, ...)'
        required: false
        default: '26'
      bake_recovery:
        description: 'Bake the macOS recovery image at build time: auto (warn on refusal), Y (fail), N (never)'
        required: false
        default: 'auto'

# A branch with an open pull request fires both triggers, and rebuilding the
# same commit twice costs a multi-gigabyte ISO download for nothing. Grouping
# both events under the head branch collapses them, and a newer push supersedes
# a run still in flight — except on the default branch, where a run may be
# publishing and must be left alone.
concurrency:
  group: build-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase. github.repository can be MixedCase.
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  # The network policy is the one part of this repository with real logic in
  # it, so it is tested before anything is built.
  test:
    name: Test vmguard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: shared/vmguard/go.mod
          # vmguard deliberately has no dependencies, so there is nothing to cache.
          cache: false

      - name: Check formatting
        working-directory: shared/vmguard
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite: $unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        working-directory: shared/vmguard
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: Unit tests
        working-directory: shared/vmguard
        run: go test -race -count=1 ./...

      # The interposition only matters if it works against the real passt, so
      # the integration tests run inside the base image that ships it.
      - name: Integration tests against real passt
        working-directory: shared/vmguard
        run: |
          go test -tags integration -c -o /tmp/vmguard.test .
          docker run --rm -v /tmp/vmguard.test:/vmguard.test \
            --entrypoint /vmguard.test qemux/qemu:latest \
            -test.v -test.timeout 300s -test.run TestIntegration

      - name: Recovery image verifier
        run: python3 images/macos/verify-recovery_test.py

      - name: Shell hooks
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          mapfile -t scripts < <(find shared/hooks images -name '*.sh' -type f | sort)
          printf 'checking: %s\n' "${scripts[@]}"
          for f in "${scripts[@]}"; do bash -n "$f"; done
          # SC1091: the sourced files only exist inside the built image.
          shellcheck -S warning -e SC1091 "${scripts[@]}"

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu
            image_suffix: ubuntu-24.04
            cache_mode: max
          - target: windows
            image_suffix: windows-11
            # mode=max caches the ISO download stage. Cold rebuilds are
            # ~5 min on the multi-connection download; warm rebuilds (when
            # only init scripts changed) skip the download entirely.
            # ~5 GB cached layer fits GHA's 10 GB per-repo quota.
            cache_mode: max
          - target: macos
            image_suffix: macos
            cache_mode: max

    steps:
      - name: Decide whether this target runs
        id: gate
        env:
          REQUESTED: ${{ github.event.inputs.targets }}
        run: |
          REQUESTED="${REQUESTED:-all}"
          if [ "$REQUESTED" = "all" ] || [ "$REQUESTED" = "${{ matrix.target }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.target }}: only '$REQUESTED' was requested."
          fi

      # Images are pushed from the default branch only. Everywhere else the
      # build runs in full but publishes nothing, so a branch can never put a
      # half-finished image into the package registry.
      - name: Decide whether to publish
        id: publish
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.push_images }}" = "true" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "Not on the default branch: building without publishing."
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Free up disk space
        if: steps.gate.outputs.run == 'true'
        run: |
          set -eux
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/lib/heroku \
            "$AGENT_TOOLSDIRECTORY" || true
          docker image prune -af || true
          docker builder prune -af || true
          df -h /

      - name: Set up Docker Buildx
        if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.gate.outputs.run == 'true' && steps.publish.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase the namespace once and reuse — GHCR rejects uppercase paths.
      - name: Compute image ref
        if: steps.gate.outputs.run == 'true'
        id: img
        run: |
          NS=$(echo "${{ env.IMAGE_NAMESPACE }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${NS}-${{ matrix.image_suffix }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Resolved image: ${IMAGE}"

      - name: Extract metadata
        if: steps.gate.outputs.run == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Compute build args
        if: steps.gate.outputs.run == 'true'
        id: args
        env:
          # Default Windows version when not running via workflow_dispatch.
          # Win 11 IoT Enterprise LTSC — smallest official Win11 ISO.
          DEFAULT_WIN_VERSION: win11x64-enterprise-iot-eval
        run: |
          set -eu

          # Build a list of KEY=VALUE pairs into a tmp file so we don't have
          # to worry about how multiline strings interact with YAML indentation.
          ARGS_FILE=$(mktemp)
          echo "GITHUB_REPOSITORY=${{ github.repository }}" >> "$ARGS_FILE"

          if [ "${{ matrix.target }}" = "ubuntu" ]; then
            CODENAME="${{ github.event.inputs.ubuntu_codename }}"
            CODENAME="${CODENAME:-noble}"
            echo "UBUNTU_CODENAME=${CODENAME}" >> "$ARGS_FILE"
          fi

          if [ "${{ matrix.target }}" = "macos" ]; then
            MACOS_VERSION="${{ github.event.inputs.macos_version }}"
            MACOS_VERSION="${MACOS_VERSION:-26}"
            BAKE="${{ github.event.inputs.bake_recovery }}"
            BAKE="${BAKE:-auto}"
            echo "MACOS_VERSION=${MACOS_VERSION}" >> "$ARGS_FILE"
            echo "BAKE_RECOVERY=${BAKE}" >> "$ARGS_FILE"
          fi

          if [ "${{ matrix.target }}" = "windows" ]; then
            URL="${{ github.event.inputs.win_iso_url }}"
            SHA="${{ github.event.inputs.win_iso_sha256 }}"

            # If the user supplied an explicit URL, use it as-is. Otherwise,
            # resolve from dockur/windows' upstream define.sh — kept current
            # whenever Microsoft rotates an ISO.
            if [ -n "$URL" ]; then
              if [ -z "$SHA" ]; then
                echo "::error::win_iso_sha256 must be set when win_iso_url is overridden" >&2
                exit 1
              fi
              echo "Using user-supplied URL: $URL"
            else
              VER="${{ github.event.inputs.win_version }}"
              VER="${VER:-$DEFAULT_WIN_VERSION}"
              echo "Resolving ISO URL+SHA for version: $VER"

              DEFINE_SH=$(mktemp)
              curl -fsSL --retry 3 \
                https://raw.githubusercontent.com/dockur/windows/master/src/define.sh \
                -o "$DEFINE_SH"

              # Extract the case block matching the requested version key
              # *inside the getMido() function* — the version key appears
              # in several other places in define.sh that we must skip.
              BLOCK=$(awk -v ver="$VER" '
                /^getMido\(\)/                         { in_func=1; next }
                in_func && /^\}/                       { exit }
                in_func && $0 ~ "\""ver"\".*\\)"       { in_block=1 }
                in_block                               { print }
                in_block && /;;/                       { exit }
              ' "$DEFINE_SH")

              if [ -z "$BLOCK" ]; then
                echo "::error::version key '$VER' not found in upstream define.sh" >&2
                rm -f "$DEFINE_SH"
                exit 1
              fi

              URL=$(echo "$BLOCK" | awk -F'"' '/url=/ {print $2; exit}')
              SHA=$(echo "$BLOCK" | awk -F'"' '/sum=/ {print $2; exit}')
              rm -f "$DEFINE_SH"

              if [ -z "$URL" ] || [ -z "$SHA" ]; then
                echo "::error::failed to extract url/sum for '$VER' from upstream define.sh" >&2
                echo "::error::block was:" >&2
                echo "$BLOCK" >&2
                exit 1
              fi

              echo "Resolved URL: $URL"
              echo "Resolved SHA: $SHA"
            fi

            echo "WIN_ISO_URL=${URL}"    >> "$ARGS_FILE"
            echo "WIN_ISO_SHA256=${SHA}" >> "$ARGS_FILE"
          fi

          # Emit as a multiline GITHUB_OUTPUT value.
          {
            echo "build_args<<__EOF__"
            cat "$ARGS_FILE"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

          rm -f "$ARGS_FILE"

      - name: Build and push
        if: steps.gate.outputs.run == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          # The context is the repository root so the shared hooks and the
          # vmguard sources are reachable from every image.
          context: .
          file: ./images/${{ matrix.target }}/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.publish.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.args.outputs.build_args }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=${{ matrix.cache_mode }},scope=${{ matrix.target }}

      # Print docker pull commands directly into the workflow run summary so
      # you don't need to dig into ghcr.io to find the image ref.
      - name: Job summary
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          {
            echo "### \`${{ matrix.target }}\` image"
            echo
            if [ "${{ steps.publish.outputs.push }}" = "true" ]; then
              echo "Pushed tags:"
              echo '```'
              echo "${{ steps.meta.outputs.tags }}"
              echo '```'
              echo
              echo "Pull:"
              echo '```bash'
              echo "docker pull ${{ steps.img.outputs.image }}:latest"
              echo '```'
              echo
              echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            else
              echo "Built without publishing (not the default branch)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disk space after build
        if: always() && steps.gate.outputs.run == 'true'
        run: df -h /
