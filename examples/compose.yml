# Три VM с постоянным хранилищем, автоперезапуском и запретом приватных сетей.
#
# Единственное обязательное устройство — /dev/kvm. Ни NET_ADMIN, ни
# /dev/net/tun, ни privileged здесь не нужны.
#
#   docker compose -f examples/compose.yml up -d
#
# Замени <you>/<repo> на свой GHCR namespace.
#
# ---------------------------------------------------------------------------
# Как заходить внутрь
#
#   Ubuntu   ssh ubuntu@127.0.0.1 -p 2222      (пароль ubuntu)
#   Windows  RDP на 127.0.0.1:3389             (Docker / admin)
#   macOS    web-консоль http://127.0.0.1:8008 или VNC 127.0.0.1:5901
#
# SSH из коробки есть только у Ubuntu. В Windows его нет вообще, в macOS
# Remote Login выключен до первого входа в систему — см. комментарии ниже.
#
# У всех трёх есть web-консоль (порт 8006 внутри контейнера): она показывает
# экран VM и нужна как раз тогда, когда сети внутри ещё нет.
#
# ---------------------------------------------------------------------------
# NET_PRESET: internet — что именно запрещено
#
#   запрещено   10/8, 172.16/12, 192.168/16, 100.64/10, 169.254/16, 127/8,
#               fc00::/7, fe80::/10, ::1 и cloud-metadata (169.254.169.254)
#   разрешено   остальной интернет, DHCP и DNS до шлюза
#
# То есть VM не видит ни домашнюю сеть, ни соседние контейнеры, ни хост.
#
# Проброшенные внутрь порты при этом работают: правила описывают, кому можно
# *начинать* разговор, а ответы на уже разрешённое соединение проходят. Без
# этого ssh на 2222 обрывался бы, потому что его пир — приватный адрес шлюза.
#
# Если VM должна ходить в конкретный сервис в приватной сети, добавь ему
# исключение — оно проверяется раньше пресета:
#
#   NET_ALLOW: "tcp:10.10.0.5:5432"
#
# Посмотреть, что реально режется:
#   docker compose -f examples/compose.yml logs ubuntu | grep blocked
# ---------------------------------------------------------------------------

services:

  ubuntu:
    image: ghcr.io/<you>/<repo>-ubuntu-24.04:latest
    restart: always
    stop_grace_period: 2m
    devices:
      - /dev/kvm
    volumes:
      - ./storage/ubuntu:/storage
    ports:
      - 127.0.0.1:8006:8006     # web-консоль
      - 127.0.0.1:2222:22       # ssh внутрь VM
    environment:
      CPU_CORES: 4
      RAM_SIZE: 8G
      DISK_SIZE: 64G

      # Какие порты самой VM пробросить наружу. Без этого ssh снаружи не виден.
      USER_PORTS: "22"

      NET_PRESET: internet

  windows:
    image: ghcr.io/<you>/<repo>-windows-11:latest
    restart: always
    stop_grace_period: 2m
    devices:
      - /dev/kvm
    volumes:
      - ./storage/windows:/storage
    ports:
      - 127.0.0.1:8007:8006     # web-консоль
      - 127.0.0.1:3389:3389     # RDP
    environment:
      CPU_CORES: 4
      RAM_SIZE: 8G
      DISK_SIZE: 64G

      # RDP; добавь 445, если нужен доступ к файлам по SMB.
      USER_PORTS: "3389"

      NET_PRESET: internet

  macos:
    image: ghcr.io/<you>/<repo>-macos:latest
    restart: always
    stop_grace_period: 2m
    devices:
      - /dev/kvm
    volumes:
      - ./storage/macos:/storage
    ports:
      - 127.0.0.1:8008:8006     # web-консоль (установка идёт здесь)
      - 127.0.0.1:5901:5900     # VNC
    environment:
      CPU_CORES: 4
      RAM_SIZE: 8G
      DISK_SIZE: 128G

      # SSH в macOS выключен, пока не включишь Remote Login в System Settings.
      # После этого раскомментируй строку ниже и проброс порта, и заходи как
      # ssh <твой-юзер>@127.0.0.1 -p 2223
      # USER_PORTS: "22"

      NET_PRESET: internet
